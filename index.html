<!DOCTYPE html>
<head>
<title>Solar System</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

body {
    height: 100vh;
    overflow: hidden;
    background: #000;
    background-image: url("https://media.istockphoto.com/id/2165838619/vector/vector-colorful-abstract-universe-backgroud-with-galaxies-and-glowing-stars.jpg?s=612x612&w=0&k=20&c=oXF59JUdF4dQnOzds8whs7ZP2bhT4xihLaNKN1SEvyE=");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    justify-content: center;
    align-items: center;
}

    .solar-system {
        position: relative;
        width: 700px;
        height: 700px;
    }

    .sun {
        position: absolute;
        width: 90px;
        height: 90px;
        background: #ffd000;
        border-radius: 50%;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 40px #ff9800, 0 0 80px #ff6600;
    }

    .orbit {
        position: absolute;
        top: 50%;
        left: 50%;
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        animation: rotate linear infinite;
    }

    .planet {
        position: absolute;
        border-radius: 50%;
        top: -8px;
        left: 50%;
        transform: translateX(-50%);
    }

    .mercury-orbit {
        width: 140px;
        height: 140px;
        animation-duration: 4s;
    }

    .mercury {
        width: 12px;
        height: 12px;
        background: #aaa;
    }


    .venus-orbit {
        width: 200px;
        height: 200px;
        animation-duration: 7s;
    }

    .venus {
        width: 18px;
        height: 18px;
        background: #d99b45;
    }


    .earth-orbit {
        width: 280px;
        height: 280px;
        animation-duration: 10s;
    }

    .earth {
        width: 20px;
        height: 20px;
        background: #2196f3;
        box-shadow: 0 0 8px #2196f3;
    }

    .mars-orbit {
        width: 360px;
        height: 360px;
        animation-duration: 15s;
    }

    .mars {
        width: 16px;
        height: 16px;
        background: #e64a19;
    }

    .jupiter-orbit {
        width: 460px;
        height: 460px;
        animation-duration: 20s;
    }

    .jupiter {
        width: 35px;
        height: 35px;
        background: #c58b60;
    }

    .saturn-orbit {
        width: 570px;
        height: 570px;
        animation-duration: 25s;
    }

    .saturn {
        width: 30px;
        height: 30px;
        background: #e6c27a;
    }

    .saturn::after {
        content: "";
        position: absolute;
        width: 50px;
        height: 12px;
        border: 3px solid #d8c08a;
        border-radius: 50%;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(-20deg);
    }

    .uranus-orbit {
        width: 660px;
        height: 660px;
        animation-duration: 30s;
    }

    .uranus {
        width: 24px;
        height: 24px;
        background: #65d6d6;
    }

    @keyframes rotate {
        from {
            transform: translate(-50%, -50%) rotate(0deg);
        }
        to {
            transform: translate(-50%, -50%) rotate(360deg);
        }
    }
</style>
</head>

<body>

<div class="solar-system">

    <div class="sun"></div>

    <div class="orbit mercury-orbit">
        <div class="planet mercury"></div>
    </div>

    <div class="orbit venus-orbit">
        <div class="planet venus"></div>
    </div>

    <div class="orbit earth-orbit">
        <div class="planet earth"></div>
    </div>

    <div class="orbit mars-orbit">
        <div class="planet mars"></div>
    </div>

    <div class="orbit jupiter-orbit">
        <div class="planet jupiter"></div>
    </div>

    <div class="orbit saturn-orbit">
        <div class="planet saturn"></div>
    </div>

    <div class="orbit uranus-orbit">
        <div class="planet uranus"></div>
    </div>

</div>

</body>
</html>
